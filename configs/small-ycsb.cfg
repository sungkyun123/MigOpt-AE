// MigOpt-AE small-scale config: ycsb
trace_file = "traces/ycsb.trace";
trace_sampling_ratio = 1;

nr_tiers = 4;
tier_cap_scale = 10;          // tiers hold 110% of the sampled working set
tier_cap_ratio = [1, 1, 4, 4]; // T0:T1:T2:T3 = L-DRAM : R-DRAM : L-PMEM : R-PMEM

tier_lat_loads  = [80, 130, 300, 350];   // ns
tier_lat_stores = [80, 130, 300, 350];   // ns
tier_lat_4KB_reads  = [773000, 869000, 1047000, 1695000]; // ns, scaled by mig_overhead/10000
tier_lat_4KB_writes = [773000, 869000, 1047000, 1695000];

mig_period = 16000;
mig_traffic = 50;
mig_overhead = 5;

do_an = -1;
do_at = -1;
do_mtm = -1;
do_migopt = 1;
do_analysis = -1;
